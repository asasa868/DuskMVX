plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

android {
    compileSdk {
        version = release(ProjectConfigs.compileSdk) {
            minorApiLevel = ProjectConfigs.compileSdkMinor
        }
    }
    buildToolsVersion = ProjectConfigs.buildToolsVersion
    ndkVersion = ProjectConfigs.ndkVersion

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId = ProjectConfigs.applicationId
        minSdk = ProjectConfigs.minSdk
        targetSdk = ProjectConfigs.targetSdk
        versionCode = ProjectConfigs.versionCode
        versionName = ProjectConfigs.versionName

    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }

    packaging {
        resources.excludes.add("META-INF/gradle/incremental.annotation.processors")
    }
    namespace = 'com.lzq.dusk'


}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("${ProjectConfigs.applicationId}${ProjectConfigs.versionName}_${variant.buildType}.apk")
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

room {
    schemaDirectory("${projectDir}/schemas")
}

dependencies {

    implementation project(path: ':dawn')
    implementation project(path: ':login')
    implementation project(path: ':main-compose')
    // implementation 'com.github.asasa868:DuskMVX:0.0.21'

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

}
