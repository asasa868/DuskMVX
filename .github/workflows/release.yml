name: publish JitPack
on:
  push:
    tags:
      - "*"


jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create Release with Release Notes
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Trigger JitPack lookup
        run: |
          echo "打包版本: ${{ github.repository }}&tag=${{ github.ref_name }}"
          sleep 10
          curl -X GET "https://jitpack.io/api/builds/com.github.asasa868/DuskMVX"
          curl -X GET "https://jitpack.io/api/versions/com.github.asasa868/DuskMVX"
          curl -X GET "https://jitpack.io/api/refs/com.github.asasa868/DuskMVX"